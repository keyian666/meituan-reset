name: build-dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid xz make
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          ln -sfn "$(xcrun --sdk iphoneos --show-sdk-path)" "$THEOS/sdks/iPhoneOS.sdk"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Check substrate (hook engine)
        run: |
          echo "--- looking for libsubstrate ---"
          find "$THEOS" -name "libsubstrate*" 2>/dev/null || true
          ls "$THEOS/vendor/lib" 2>/dev/null || true

      - name: Build
        run: |
          make clean || true
          make -j4 2>&1 | tee build.log

      - name: Collect dylib
        run: |
          mkdir -p out
          find .theos -name "MTDeviceSpoof.dylib" -exec cp {} out/ \;
          ls -la out/ || true
          file out/*.dylib || true

      - uses: actions/upload-artifact@v4
        with:
          name: MTDeviceSpoof-dylib
          path: out/*.dylib
          if-no-files-found: warn
