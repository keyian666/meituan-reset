name: build-dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -euo pipefail
          brew install ldid xz
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

          # Theos 自带空的 sdks 占位目录，先清掉再软链 Xcode 的 SDK
          rm -rf "$THEOS/sdks"
          mkdir -p "$THEOS/sdks"

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Xcode SDK: $SDK (version $VER)"

          ln -sfn "$SDK" "$THEOS/sdks/iPhoneOS.sdk"
          ln -sfn "$SDK" "$THEOS/sdks/iPhoneOS${VER}.sdk"

          echo "=== sdks ==="
          ls -la "$THEOS/sdks"
          echo "=== sdk sanity ==="
          ls "$SDK/SDKSettings.plist" && ls "$SDK/usr/include" | head -3

      - name: Check substrate
        run: |
          set -euo pipefail
          echo "THEOS=$THEOS"
          find "$THEOS" -name "libsubstrate*" 2>/dev/null || echo "NO SUBSTRATE FILE"
          ls -la "$THEOS/vendor/lib" 2>/dev/null || echo "no vendor/lib"

      - name: Build
        run: |
          set -o pipefail
          echo "=== makefile candidates ==="
          ls -la Makefile makefile 2>/dev/null || true
          make clean 2>/dev/null || true
          make -j4 2>&1 | tee build.log
          echo "=== make exit: $? ==="
          find . -name "*.dylib" 2>/dev/null || true
          ls -la packages 2>/dev/null || true

      - name: Verify dylib
        run: |
          set -euo pipefail
          mkdir -p out
          find . -name "MTDeviceSpoof.dylib" -exec cp {} out/ \;
          ls -la out/ || true
          if [ ! -f out/MTDeviceSpoof.dylib ]; then
            echo "::error::dylib not produced - check build-output artifact"
            exit 1
          fi
          file out/MTDeviceSpoof.dylib
          echo "=== undefined symbols ==="
          nm -u out/MTDeviceSpoof.dylib 2>/dev/null | head -20 || true

      - name: Upload artifacts + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            out/
            build.log
          if-no-files-found: warn
