name: build-dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show sources
        run: |
          ls -la
          head -30 Tweak.m

      - name: Compile dylib with clang (no Theos)
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          mkdir -p out

          clang -arch arm64 \
            -dynamiclib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -O2 \
            -Wno-deprecated-declarations \
            -Wno-unused-function \
            -Wno-unused-variable \
            -install_name @executable_path/Frameworks/MTDeviceSpoof.dylib \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            -framework AdSupport \
            -framework CoreTelephony \
            -framework CoreMotion \
            -framework SystemConfiguration \
            -framework NetworkExtension \
            -framework CFNetwork \
            -o out/MTDeviceSpoof.dylib \
            Tweak.m

          ls -la out/
          file out/MTDeviceSpoof.dylib

      - name: Sign
        run: |
          set -euo pipefail
          brew install ldid
          ldid -S out/MTDeviceSpoof.dylib

      - name: Verify
        run: |
          set -euo pipefail
          otool -L out/MTDeviceSpoof.dylib
          if otool -L out/MTDeviceSpoof.dylib | grep -qi "CydiaSubstrate"; then
            echo "::error::depends on CydiaSubstrate"
            exit 1
          fi
          echo "OK: no substrate dependency"
          lipo -info out/MTDeviceSpoof.dylib

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: out/
          if-no-files-found: warn
